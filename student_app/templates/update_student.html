{% extends 'base.html' %}

{% load static %}

{% block title %}
Update Student
{% endblock %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/update_student.css' %}">
<h1>Update Student</h1>
<div class="card">
    <form method = "post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Update</button>
    </form>
</div>
<div class="back-link"><a href="{% url 'students' %}">Back to Student List</a></div>
{% endblock %}
